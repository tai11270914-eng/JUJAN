<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>ジュージャンカウンター</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f5f7;color:#171717}.app{max-width:520px;margin:auto;min-height:100vh;background:white;padding:20px 16px 90px}h1{font-size:25px;margin:8px 0 4px}.sub{color:#777;margin-bottom:20px}.card{background:#f7f7f8;border-radius:18px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.person,.menu{border:1px solid #ddd;background:#fff;border-radius:13px;padding:12px;font-weight:600}.person.on{background:#171717;color:white}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:11px 0}select,input{font-size:16px;padding:10px;border:1px solid #ddd;border-radius:10px;max-width:55%}.total{font-size:28px;font-weight:800}.primary{width:100%;border:0;border-radius:15px;padding:15px;background:#171717;color:white;font-size:17px;font-weight:700}.tabs{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;background:#fff;border-top:1px solid #ddd;display:flex}.tabs button{flex:1;padding:14px 4px;border:0;background:white}.screen{display:none}.screen.on{display:block}.history{border-bottom:1px solid #eee;padding:12px 0}.tiny{font-size:12px;color:#888}.danger{background:#fff;border:1px solid #ddd;color:#222}.stat{font-size:22px;font-weight:800}</style></head><body><div class='app'>
<section id='entry' class='screen on'><h1>🍦 ジュージャン</h1><div class='sub'>負けた人と注文を選んで登録</div><div class='card'><b>① 負けた人</b><div id='losers' class='grid' style='margin-top:12px'></div></div><div class='card'><b>② みんなの注文</b><div id='orders'></div><div class='row'><b>今回の合計</b><span id='roundTotal' class='total'>¥0</span></div></div><button class='primary' onclick='saveRound()'>この回を登録</button></section>
<section id='stats' class='screen'><h1>📊 集計</h1><div id='statsBox'></div></section>
<section id='history' class='screen'><h1>🕘 履歴</h1><div id='historyBox'></div></section>
<section id='settings' class='screen'><h1>⚙️ 設定</h1><div class='card'><b>メニュー追加</b><div class='row'><input id='newMenu' placeholder='メニュー名'><input id='newPrice' type='number' placeholder='価格'></div><button class='primary' onclick='addMenu()'>追加</button></div><div id='menuList'></div><button class='primary danger' onclick='resetData()'>履歴をすべて削除</button></section>
</div><nav class='tabs'><button onclick="tab('entry')">📝<br>入力</button><button onclick="tab('stats')">📊<br>集計</button><button onclick="tab('history')">🕘<br>履歴</button><button onclick="tab('settings')">⚙️<br>設定</button></nav>
<script>
const people=['坂田さん','橋本さん','小峯さん','若麻績さん','深川さん','金巻さん','ミーサイさん','竹内','延田','山本'];
let menus=JSON.parse(localStorage.getItem('jj_menus')||'null')||[{n:'節約',p:150},{n:'ピンモン',p:150},{n:'デュー',p:120},{n:'烏龍茶',p:150},{n:'ジンジャー',p:100},{n:'三ツ矢',p:0},{n:'アルギニン',p:0},{n:'モンスター',p:0},{n:'コカコーラ',p:0},{n:'リアゴー',p:0},{n:'ドクペ',p:0},{n:'ノープ',p:0},{n:'グアモン',p:0},{n:'マッチ',p:0}];
let rounds=JSON.parse(localStorage.getItem('jj_rounds')||'[]'), loser='';
function yen(n){return '¥'+Number(n).toLocaleString()}
function render(){document.getElementById('losers').innerHTML=people.map(p=>`<button class='person ${loser===p?'on':''}' onclick="loser='${p}';render()">${p}</button>`).join('');document.getElementById('orders').innerHTML=people.map((p,i)=>`<div class='row'><span>${p}</span><select id='o${i}' onchange='calc()'>${menus.map((m,j)=>`<option value='${j}'>${m.n} (${yen(m.p)})</option>`).join('')}</select></div>`).join('');renderStats();renderHistory();renderSettings();calc()}
function calc(){let t=0;people.forEach((_,i)=>{let e=document.getElementById('o'+i);if(e)t+=menus[+e.value].p});document.getElementById('roundTotal').textContent=yen(t);return t}
function saveRound(){if(!loser){alert('負けた人を選んで！');return}let os=people.map((p,i)=>{let m=menus[+document.getElementById('o'+i).value];return {person:p,menu:m.n,price:m.p}});rounds.unshift({date:new Date().toLocaleString('ja-JP'),loser,orders:os,total:os.reduce((a,b)=>a+b.price,0)});localStorage.setItem('jj_rounds',JSON.stringify(rounds));alert('登録した！');loser='';render()}
function renderStats(){let b=document.getElementById('statsBox');b.innerHTML=people.map(p=>{let lost=rounds.filter(r=>r.loser===p),paid=lost.reduce((a,r)=>a+r.total,0),own=rounds.reduce((a,r)=>a+(r.orders.find(o=>o.person===p)?.price||0),0);return `<div class='card'><b>${p}</b><div class='row'><span>負け</span><span class='stat'>${lost.length}回</span></div><div class='row'><span>奢った金額</span><span>${yen(paid)}</span></div><div class='row'><span>注文金額</span><span>${yen(own)}</span></div></div>`}).join('')}
function renderHistory(){document.getElementById('historyBox').innerHTML=rounds.length?rounds.map(r=>`<div class='history'><b>${r.loser} が負け</b><span style='float:right'>${yen(r.total)}</span><div class='tiny'>${r.date}</div><div class='tiny'>${r.orders.map(o=>o.person+'：'+o.menu).join(' / ')}</div></div>`).join(''):'<div class="card">まだ履歴はありません</div>'}
function renderSettings(){document.getElementById('menuList').innerHTML='<div class="card">'+menus.map((m,i)=>`<div class='row'><span>${m.n}</span><span>${yen(m.p)} <button onclick='delMenu(${i})'>削除</button></span></div>`).join('')+'</div>'}
function addMenu(){let n=document.getElementById('newMenu').value.trim(),p=+document.getElementById('newPrice').value;if(!n)return;menus.push({n,p});localStorage.setItem('jj_menus',JSON.stringify(menus));render()}
function delMenu(i){if(menus.length<=1)return;menus.splice(i,1);localStorage.setItem('jj_menus',JSON.stringify(menus));render()}
function resetData(){if(confirm('履歴を全部削除する？')){rounds=[];localStorage.setItem('jj_rounds','[]');render()}}
function tab(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');render()}
render();</script></body></html>
